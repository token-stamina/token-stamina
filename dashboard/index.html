<title>Token Stamina 현황</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 휴대폰 1열. 계정 띠 -> 효율 요약 띠 -> 세션 카드 -> (제안 카드 자리) -> 개입 로그. 읽기 전용. */
:root{
  --bg:#f6f7f5; --panel:#ffffff; --fg:#1b2420; --muted:#5d6a63; --line:#dde2de;
  --accent:#1f6f5c; --ok:#2e7d4f; --warn:#b45f06; --bad:#b3261e; --track:#e6eae7; --spark:#1f6f5c;
  --font-sans:"IBM Plex Sans KR","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101714; --panel:#18211d; --fg:#e6ece8; --muted:#97a69d; --line:#2a3731;
  --accent:#5fc4a6; --ok:#6ccb8c; --warn:#f0a35a; --bad:#ff8a80; --track:#26322c; --spark:#5fc4a6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101714; --panel:#18211d; --fg:#e6ece8; --muted:#97a69d; --line:#2a3731;
  --accent:#5fc4a6; --ok:#6ccb8c; --warn:#f0a35a; --bad:#ff8a80; --track:#26322c; --spark:#5fc4a6; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:14px;line-height:1.5;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#ts-root{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-width:0}
#ts-root *{box-sizing:border-box;min-width:0}
h1{font-size:18px;margin:0;font-weight:650}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.when{font-size:13px;color:var(--muted)}
.when.late{color:var(--warn);font-weight:600}
.band{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.late-note{border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.02em}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:8px}
.meter .v{font-family:var(--font-mono);font-size:22px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--track);border-radius:3px;margin:4px 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.green{color:var(--ok);border-color:var(--ok)}
.pill.yellow{color:var(--warn);border-color:var(--warn)}
.pill.red{color:var(--bad);border-color:var(--bad)}
.pill.est{border-style:dashed}
.sum{display:flex;flex-wrap:wrap;gap:4px 14px;font-variant-numeric:tabular-nums}
.sum b{font-family:var(--font-mono);font-weight:600}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px 12px}
.kv .v{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.spark svg{display:block;width:100%;height:40px}
.sug{font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.sug:empty{display:none}
.foot{font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:24px 12px}
.log ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.log li{font-size:13px;overflow-wrap:anywhere}
#proposals:empty{display:none}
.hide{display:none}
/* W9-1f: 지연 띠 · 공유 경고 · 제안 카드 · 설정 패널 */
.lag{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--panel)}
.lag.late{border-color:var(--warn);color:var(--warn)}
.share-warn{border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin:4px 0 0}
.sec-h h2{margin:0;font-size:15px;font-weight:650}
.pcard.expired,.pcard.done{opacity:.8}
.pcard .what{font-size:14px}
.pcard .tag{font-size:12px;color:var(--muted)}
.pill.irrev{color:var(--bad);border-color:var(--bad);font-weight:600}
.pill.solid{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.note{font-size:12.5px;color:var(--muted)}
.note.warn{color:var(--warn)}
.note.bad{color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button.b{font:inherit;font-size:14px;min-height:40px;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button.b.ok{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
button.b.no{color:var(--bad);border-color:var(--bad)}
button.b:disabled{opacity:.45;cursor:not-allowed}
button.b:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;border-top:1px solid var(--line);padding-top:8px}
.tl div{font-size:12px;border-left:2px solid var(--line);padding-left:8px;overflow-wrap:anywhere}
.tl div.on{border-left-color:var(--accent)}
.tl div.bad{border-left-color:var(--bad)}
.tl b{display:block;font-weight:600;color:var(--muted)}
.tl .on b{color:var(--fg)}
.set summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;list-style:none}
.set summary::-webkit-details-marker{display:none}
.set summary b{font-size:15px;font-weight:650}
.set .body{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label,.fld .lbl{font-size:12px;color:var(--muted)}
.fld input[type=number],.fld select,.fld textarea{font:inherit;font-size:14px;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.fld textarea{min-height:64px;resize:vertical;font-family:var(--font-mono);font-size:13px}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;flex-wrap:wrap}
.chk input{width:18px;height:18px}
.locked{border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--muted)}
.cmp{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.cmp li{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;overflow-wrap:anywhere}
.cmp li.diff{border-color:var(--warn)}
.cmp li.diff .st{color:var(--warn);font-weight:600}
.cmp code{font-family:var(--font-mono);font-size:12.5px}
.err{color:var(--bad);font-size:13px}
</style>

<div id="ts-root">
  <div class="top"><h1>Token Stamina 현황</h1><span id="when" class="when">불러오는 중…</span></div>
  <div id="late" class="late-note hide">갱신 명령이 안 돌고 있어요. 관리 탭에서 /token-stamina:board 를 실행해 주세요.</div>
  <div id="lag" class="lag" role="status"></div>
  <div id="share" class="share-warn hide">공유 중이에요. 결정은 누구나 쓸 수 있어요.</div>
  <section class="band" id="account" aria-label="계정"></section>
  <section class="band" id="summary" aria-label="효율 요약"></section>
  <section id="sessions" class="cards" aria-label="세션"></section>
  <section id="proposals" class="cards" aria-label="제안"></section>
  <details class="band set" id="settings" aria-label="설정">
    <summary><b>설정</b><span id="set-state" class="pill">요청 없음</span></summary>
    <div class="body">
      <div id="set-form"></div>
      <div id="set-cmp"></div>
    </div>
  </details>
  <section class="band log" id="log" aria-label="개입 로그"></section>
  <p class="foot">값은 로컬에서 측정한 것이고, 모델 적합도와 절약량은 추정이에요. 이 화면이 쓰는 것은 제안 결정과 설정 요청뿐이고, 적용은 로컬 동기화가 해요.</p>
</div>

<script>
(function(){
  var STALE_MIN=30;
  var $=function(id){return document.getElementById(id)};
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function num(x){return typeof x==="number"&&isFinite(x)}
  function fmtTok(n){return !num(n)?"—":n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?Math.round(n/1e3)+"k":String(Math.round(n))}
  function pct(x){return num(x)?Math.round(x*100)+"%":"—"}
  function agoMin(iso,now){var t=Date.parse(iso);return isNaN(t)?null:Math.max(0,Math.round((now-t)/60000))}
  function agoText(m){return m==null?"—":m<1?"방금":m<60?m+"분 전":Math.floor(m/60)+"시간 "+(m%60)+"분 전"}

  var GRADE={green:"여유",yellow:"주의",red:"넘침"};
  var FIT={lower_candidate:"낮출 후보",fit:"적합",judgment_on_lower:"판단 작업에 하위 모델"};

  function sparkline(vals){
    var n=vals.length,W=200,H=40,pad=4,svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.setAttribute("preserveAspectRatio","none");
    svg.setAttribute("role","img");svg.setAttribute("aria-label","최근 턴의 다시 읽는 맥락 추세");
    if(n<2)return svg;
    var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),sp=(mx-mn)||1;
    var pts=vals.map(function(v,i){return [pad+i*(W-2*pad)/(n-1),H-pad-(v-mn)/sp*(H-2*pad)]});
    var NS="http://www.w3.org/2000/svg";
    var base=document.createElementNS(NS,"line");base.setAttribute("x1",pad);base.setAttribute("x2",W-pad);base.setAttribute("y1",H-1);base.setAttribute("y2",H-1);base.setAttribute("stroke","var(--line)");svg.appendChild(base);
    var d=pts.map(function(p,i){return(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)}).join(" ");
    var area=document.createElementNS(NS,"path");area.setAttribute("d",d+" L"+pts[n-1][0]+" "+(H-1)+" L"+pts[0][0]+" "+(H-1)+" Z");area.setAttribute("fill","var(--spark)");area.setAttribute("fill-opacity","0.12");svg.appendChild(area);
    var ln=document.createElementNS(NS,"path");ln.setAttribute("d",d);ln.setAttribute("fill","none");ln.setAttribute("stroke","var(--spark)");ln.setAttribute("stroke-width","1.5");ln.setAttribute("vector-effect","non-scaling-stroke");svg.appendChild(ln);
    var last=pts[n-1],c=document.createElementNS(NS,"circle");c.setAttribute("cx",last[0]);c.setAttribute("cy",last[1]);c.setAttribute("r","2.6");c.setAttribute("fill","var(--spark)");svg.appendChild(c);
    return svg;
  }

  function kv(label,val){var d=el("div");d.appendChild(el("div","lbl",label));d.appendChild(el("div","v",val));return d}

  function renderAccount(a,now){
    var box=$("account");box.textContent="";
    if(!a){box.appendChild(el("div","lbl","계정 사용량"));box.appendChild(el("div","empty","아직 기록 없음"));return}
    var head=el("div","row");head.appendChild(el("span","lbl","계정 사용량"));
    if(a.grade){head.appendChild(el("span","pill "+a.grade,"오늘 몫 대비 "+(GRADE[a.grade]||a.grade)+(num(a.vs_share_pp)?" ("+(a.vs_share_pp>0?"+":"")+Math.round(a.vs_share_pp)+"%p)":"")))}
    box.appendChild(head);
    var m=el("div","meters");
    [["7일 창",a.pct_7d],["5시간 창",a.pct_5h],["Fable 창",a.pct_fable]].forEach(function(x){
      if(!num(x[1]))return;var d=el("div","meter");d.appendChild(el("div","lbl",x[0]));d.appendChild(el("div","v",Math.round(x[1])+"%"));
      var b=el("div","bar"),i=el("i");i.style.width=Math.max(0,Math.min(100,x[1]))+"%";b.appendChild(i);d.appendChild(b);m.appendChild(d)});
    box.appendChild(m);
    var f=[];
    if(a.stale)f.push("값 오래됨(6시간 넘음)");
    else if(a.measured_at){f.push(agoText(agoMin(a.measured_at,now))+" 측정")}
    if(a.resets_at){var r=Math.round((Date.parse(a.resets_at)-now)/60000);if(r>0)f.push("리셋까지 "+Math.floor(r/60)+"시간 "+(r%60)+"분")}
    if(f.length){var p=el("div","foot",f.join(" · "));if(a.stale)p.style.color="var(--warn)";box.appendChild(p)}
  }

  function renderSummary(s,rows){
    var box=$("summary");box.textContent="";
    if(!s&&!rows.length){box.appendChild(el("div","lbl","효율 요약"));box.appendChild(el("div","empty","아직 기록 없음"));return}
    if(!s){
      var h=0,w=0;rows.forEach(function(r){if(num(r.hit)){h+=r.hit;w++}});
      s={sessions:rows.length,agents:rows.reduce(function(a,r){return a+(r.agents_running||0)},0),hit:w?h/w:null,
         lower:rows.filter(function(r){return r.fit==="lower_candidate"}).length,clear:rows.filter(function(r){return r.clear_candidate}).length};
    }
    box.appendChild(el("div","lbl","효율 요약"));
    var d=el("div","sum");
    [["세션",s.sessions],["에이전트",s.agents],["캐시 적중",s.hit==null?"—":pct(s.hit)],["낮출 후보",s.lower],["비우기 후보",s.clear]].forEach(function(x){
      var sp=el("span");sp.appendChild(document.createTextNode(x[0]+" "));sp.appendChild(el("b",null,x[1]==null?"—":String(x[1])));d.appendChild(sp)});
    box.appendChild(d);
  }

  function renderSessions(rows,now){
    var box=$("sessions");box.textContent="";
    if(!rows.length){var e=el("div","band empty","아직 기록 없음. 세션을 열고 한 턴 쓰면 여기에 나타나요.");box.appendChild(e);return}
    rows.sort(function(a,b){return (b.last_ts?Date.parse(b.last_ts):0)-(a.last_ts?Date.parse(a.last_ts):0)});
    rows.forEach(function(r){
      var c=el("article","card");
      var t=el("div","row");t.appendChild(el("h3",null,r.title||r.cwd_tail||(r.sid||"").slice(0,8)));
      var b=el("span");if(r.model)b.appendChild(el("span","pill",r.model));
      if(r.protected){var pr=el("span","pill","보호");pr.style.marginLeft="6px";b.appendChild(pr)}
      t.appendChild(b);c.appendChild(t);
      if(r.spark&&r.spark.length){var sp=el("div","spark");sp.appendChild(sparkline(r.spark.slice(-20)));c.appendChild(sp);
        var tr=num(r.in_trend)?(r.in_trend>0?"늘어나는 중":r.in_trend<0?"줄어드는 중":"변화 없음"):"";
        c.appendChild(el("div","foot","턴당 다시 읽는 맥락 "+fmtTok(r.in_last)+" (최근 10턴 중앙값 "+fmtTok(r.in_med10)+(tr?", "+tr:"")+") · 표본 "+(r.sample_turns==null?"—":r.sample_turns)+"턴"))}
      var k=el("div","kv");
      k.appendChild(kv("캐시 적중",pct(r.hit)+(num(r.hit_active)?" (유휴 제외 "+pct(r.hit_active)+")":"")));
      var fit=el("div");fit.appendChild(el("div","lbl","모델 적합도"));var fp=el("span","pill est",(FIT[r.fit]||"—")+" · 추정");fit.appendChild(fp);k.appendChild(fit);
      k.appendChild(kv("맥락 크기",fmtTok(r.ctx_tokens)));
      k.appendChild(kv("하위 에이전트",(r.agents_running||0)+"개 실행 · "+fmtTok((r.agent_tokens_done||0)+(r.agent_tokens_live||0))));
      c.appendChild(k);
      c.appendChild(el("div","sug",r.suggestion||""));
      c.appendChild(el("div","foot",agoText(agoMin(r.updated_at||r.last_ts,now))));
      box.appendChild(c)});
  }

  function renderLog(rows){
    var box=$("log");box.textContent="";box.appendChild(el("div","lbl","개입 로그"));
    if(!rows.length){box.appendChild(el("div","empty","아직 자동 조절 없음"));return}
    var ul=el("ul");rows.slice(0,20).forEach(function(l){
      ul.appendChild(el("li",null,(l.ts||"")+" · "+(l.action||"")+" "+(l.from||"")+(l.to?" → "+l.to:"")+(l.reason?" ("+l.reason+")":"")))});
    box.appendChild(ul);
  }

  /* ===== W9-1f: 제안 카드 · 설정 패널 · 지연 띠 =====
     쓰는 경로: decisions/<pid> {status,decided_by,decided_at}, settings/requested {values,requested_by,requested_at}
     읽는 경로: proposals/*, decisions/*, settings/requested, settings/applied (+ 기존 sessions/account/summary/log) */
  var KIND={session_model:"세션 모델 낮추기",session_clear:"세션 비우기",agent_default_model:"하위 에이전트 기본 모델 낮추기",agent_model_default:"하위 에이전트 기본 모델 낮추기",fleet_threshold:"동시 에이전트 경고선 조정",effort:"추론 강도"};
  var STATUS={proposed:"결정 대기",approved:"승인됨 · 동기화 대기",rejected:"거절함",held:"보류",applied:"적용됨",failed:"적용 실패",refused:"적용 거절",expired:"만료"};
  var MODE={manual:"직접(버튼 없음)",approve:"승인 후 적용",auto:"자동"};
  var REASON={protected:"보호 대상",stale_state:"상태가 오래됨",target_changed:"대상 세션이 그새 바뀜",expired:"근거가 오래됨",unexpected_tool_result:"도구 결과가 예상과 다름",range:"범위 밖(1~50)",order:"Hard 가 Warn 보다 작음",enum:"허용 값이 아님",locked:"잠김(자동 모드는 아직 못 써요)",size:"항목이 너무 많음",format:"형식 오류",protected_remove:"보호 항목은 뺄 수 없음",type:"형식이 맞지 않음",not_allowed:"허용되지 않은 항목",unmapped:"앱 세션과 짝이 확인되지 않음",unknown_proposal:"이 PC 가 만든 제안이 아님",grade_changed:"지금 한도 등급이 달라짐",judgment:"판단이 필요한 대화라 제외",one_per_sid:"같은 세션은 한 번에 하나만(다음 동기화)"};
  // est_saving.window codes -> label (W7 #5: the agent card is measured on the board tails, not on 24 hours)
  var WINDOW={"10_turns":"지난 10턴 환산","board_tail":"현황판이 읽은 최근 기록 환산"};
  var KEYS=["fleetWarnAt","fleetHardAt","fleetTotalWarnAt","fleetTotalHardAt","fleetModelFloor","agentModelDefault","applyMode","autoScope","dashboardMaskTitles"];
  var SCOPES=["session_model","agent_model_default","fleet_threshold"];
  function hm(iso){var t=Date.parse(iso);if(isNaN(t))return "—";var d=new Date(t);return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
  function rs(c){return c?(REASON[c]||c):""}

  var store={sessions:[],account:null,summary:null,log:[],proposals:[],decisions:{},reqS:null,appS:null,db:null,me:null,userApi:null,names:{},shared:false,demo:false};
  function myId(){return store.me&&store.me.id?store.me.id:"page-user"}
  function whoName(id){if(!id)return "페이지 사용자";if(store.names[id])return store.names[id];return id===myId()?"나":"페이지 사용자"}
  function effStatus(p,now){var d=store.decisions[p.pid];var s=(d&&d.status)||p.status||"proposed";

  function fakeDb(){
    var data={},subs=[];
    function parts(p){return p.split("/")}
    function snapCol(c){var m=data[c]||{};return {docs:Object.keys(m).map(function(id){return {id:id,exists:true,data:function(){return JSON.parse(JSON.stringify(m[id]))}}})}}
    function snapDoc(c,id){var m=data[c]||{};var ex=id in m;return {exists:ex,id:id,data:function(){return ex?JSON.parse(JSON.stringify(m[id])):undefined}}}
    function notify(c,id){subs.forEach(function(s){if(s.c===c&&(s.id==null||s.id===id))s.fn(s.id==null?snapCol(c):snapDoc(c,id))})}
    var db={
      _data:data,
      collection:function(c){var r={onSnapshot:function(fn){subs.push({c:c,id:null,fn:fn});fn(snapCol(c));return function(){}},orderBy:function(){return r},limit:function(){return r}};return r},
      doc:function(path){var a=parts(path),c=a[0],id=a[1];return {
        onSnapshot:function(fn){subs.push({c:c,id:id,fn:fn});fn(snapDoc(c,id));return function(){}},
        set:function(v){return new Promise(function(res){data[c]=data[c]||{};data[c][id]=JSON.parse(JSON.stringify(v));setTimeout(function(){notify(c,id);res()},0)})}}}
    };
    return db;
  }
